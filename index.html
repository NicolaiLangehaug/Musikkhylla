/* Platesamlingen 1.0 – kveldslys. Bevisst ett mørkt uttrykk, som rommet om kvelden. */
:root{--bunn:#151310;color-scheme:dark}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bunn);color:#F1E9DF;font-family:'Archivo',system-ui,sans-serif}
#ramme{margin:0 auto;position:relative;overflow:hidden}
#scene{width:1366px;height:1024px;transform-origin:0 0;position:absolute;left:0;top:0}
button,select,input{font:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,li:focus-visible{outline:2px solid #FF7A59;outline-offset:2px}
#dg{position:fixed;inset:0;z-index:100;background:rgba(10,8,6,0.62);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
#dg[hidden]{display:none}
.dg-kort{width:100%;max-width:620px;background:#211C17;color:#F1E9DF;border:1px solid #3A322A;border-radius:8px;padding:22px 26px 26px;box-shadow:0 20px 60px rgba(0,0,0,0.5);font-size:15px;line-height:1.5}
.dg-topp{display:flex;justify-content:space-between;align-items:center}
.dg-kort h2{margin:0;font-size:28px;font-weight:800;font-stretch:75%;letter-spacing:0.01em}
.dg-kort h3{margin:20px 0 8px;font-size:16px;font-weight:700}
.dg-mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;letter-spacing:0.06em;color:#BFB2A3}
.dg-x{width:40px;height:40px;border-radius:9999px;border:1px solid #3A322A;background:transparent;color:#F1E9DF;font-size:22px;cursor:pointer}
.dg-steg{padding-left:22px;display:flex;flex-direction:column;gap:16px;margin:16px 0 4px}
.dg-steg li::marker{font-family:'IBM Plex Mono',monospace;color:#FF7A59}
.dg-prim,.dg-sek{display:inline-flex;align-items:center;height:42px;padding:0 16px;border-radius:4px;font:700 14px 'Archivo',sans-serif;cursor:pointer;margin-top:8px}
.dg-prim{background:#FF7A59;color:#2A0F07;border:0}
.dg-prim[disabled]{opacity:0.6;cursor:wait}
.dg-sek{background:transparent;color:#F1E9DF;border:1px solid #574B3F}
.dg-fil input{position:absolute;width:1px;height:1px;opacity:0}
.dg-fil:focus-within{outline:2px solid #FF7A59;outline-offset:2px}
.dg-liste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.dg-liste li{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:8px;border-radius:4px;background:#2A241E}
.dg-plate{display:flex;gap:10px;align-items:center;min-width:0;flex:1 1 240px}
.dg-plate img,.dg-tom{width:44px;height:44px;object-fit:cover;border-radius:2px;flex:none;background:#3A322A}
.dg-liste select{height:38px;max-width:100%;border-radius:4px;background:#151310;color:#F1E9DF;border:1px solid #574B3F;font:14px 'Archivo',sans-serif;padding:0 6px}
.dg-knapper{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.dg-kopi{width:100%;height:180px;box-sizing:border-box;background:#151310;color:#F1E9DF;border:1px solid #574B3F;border-radius:4px;font:12px 'IBM Plex Mono',monospace}
.dg-melding{margin:16px 0 0;padding:10px 12px;border-left:3px solid #FF7A59;background:#2A241E}

body{margin:0}
.hot{background:transparent}
.hot:hover{background:rgba(255,255,255,0.16) !important}
@keyframes spinn{to{transform:rotate(360deg)}}
@keyframes puls-knapp{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes puls{0%{transform:scale(0.7);opacity:0.7}100%{transform:scale(1.9);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

.gh-status{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:var(--topp,64px);z-index:90;height:30px;padding:0 12px;border-radius:9999px;border:1px solid #3A322A;background:rgba(20,17,14,0.82);color:#BFB2A3;font:600 11px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer}
.gh-status.gh-lagret{color:#9FD39A}
.gh-status.gh-lagrer,.gh-status.gh-venter{color:#F1E9DF}
.gh-status.gh-feil,.gh-status.gh-nøkkel,.gh-status.gh-ulokal{color:#FF7A59;border-color:#FF7A59}
#gh-dialog{position:fixed;inset:0;z-index:120;background:rgba(10,8,6,0.62);display:flex;align-items:flex-start;justify-content:center;padding:max(40px,env(safe-area-inset-top,0px)) 16px 24px;box-sizing:border-box}
#gh-dialog[hidden]{display:none}
.gh-kort{width:100%;max-width:520px;background:#211C17;color:#F1E9DF;border:1px solid #3A322A;border-radius:8px;padding:22px 26px;font-size:15px;line-height:1.5;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.gh-kort h2{margin:0 0 8px;font-size:26px;font-weight:800;font-stretch:75%}
.gh-mono{font:12px 'IBM Plex Mono',monospace;letter-spacing:0.06em;color:#BFB2A3}
.gh-felt{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px;margin-top:12px}
.gh-felt input{height:42px;border-radius:4px;border:1px solid #574B3F;background:#151310;color:#F1E9DF;padding:0 10px;font:14px 'IBM Plex Mono',monospace}
.gh-knapper{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.gh-prim,.gh-sek{height:42px;padding:0 16px;border-radius:4px;font:700 14px 'Archivo',sans-serif;cursor:pointer}
.gh-prim{background:#FF7A59;color:#2A0F07;border:0}
.gh-sek{background:transparent;color:#F1E9DF;border:1px solid #574B3F}
.spiller{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:80;width:340px;max-width:calc(100vw - 32px);border-radius:8px;overflow:hidden;background:#0E0C0A;border:1px solid #3A322A;box-shadow:0 14px 40px rgba(0,0,0,0.55);transition:opacity 250ms,transform 250ms}
.spiller.skjult{opacity:0;pointer-events:none;transform:translateY(12px)}
.spiller-topp{display:flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 12px;background:#211C17}
.spiller-tittel{flex:1;font:600 11px 'IBM Plex Mono',monospace;letter-spacing:0.08em;text-transform:uppercase;color:#FF7A59}
.spiller-knapp{width:26px;height:24px;border-radius:4px;border:1px solid #3A322A;background:transparent;color:#F1E9DF;font-size:15px;line-height:1;cursor:pointer}
#spiller-yt{display:block;width:100%;aspect-ratio:16/9;height:auto}
.spiller.liten{width:220px}
#spiller iframe{display:block;width:100%;height:auto;aspect-ratio:16/9;border:0}

#sj{position:fixed;inset:0;z-index:100;background:rgba(10,8,6,0.62);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;box-sizing:border-box}
#sj[hidden]{display:none}
.sj-kort{width:100%;max-width:640px;background:#211C17;color:#F1E9DF;border:1px solid #3A322A;border-radius:8px;padding:20px 22px 22px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.sj-topp{display:flex;align-items:center;gap:14px}
.sj-topp h2{margin:0;font-size:28px;font-weight:800;font-stretch:75%;flex:none}
.sj-topp .sj-mono{flex:1}
.sj-mono{font:12px 'IBM Plex Mono',monospace;letter-spacing:0.06em;color:#BFB2A3}
.sj-hjelp{margin:8px 0 14px;color:#BFB2A3;font-size:14px}
.sj-liste,.sj-sub{list-style:none;margin:0;padding:0}
.sj-liste>li{border-top:1px solid #3A322A;padding:6px 0}
.sj-fam,.sj-und{width:100%;display:grid;grid-template-columns:18px minmax(0,1fr) 120px 40px minmax(0,130px);align-items:center;gap:10px;padding:8px 6px;border:0;border-radius:4px;background:transparent;color:inherit;cursor:pointer;text-align:left;font:inherit}
.sj-fam:hover,.sj-und:hover{background:#2A241E}
.sj-fam .sj-navn{font-weight:800;text-transform:uppercase;letter-spacing:0.04em;font-size:15px}
.sj-und{grid-template-columns:18px minmax(0,1fr) 120px 40px minmax(0,130px);padding:4px 6px}
.sj-und::before{content:"";grid-column:1}
.sj-und .sj-navn{grid-column:2;font-size:14px;color:#E3D8CB}
.sj-und .sj-tall{grid-column:4}
.sj-und .sj-celle{grid-column:5}
.sj-prikk{width:12px;height:12px;border-radius:9999px}
.sj-stolpe{height:6px;border-radius:3px;background:#3A322A;overflow:hidden}
.sj-stolpe span{display:block;height:100%}
.sj-tall{font:600 13px 'IBM Plex Mono',monospace;text-align:right}
.sj-celle{font:11px 'IBM Plex Mono',monospace;color:#BFB2A3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sj-merke{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:var(--topp,64px);z-index:95;height:32px;padding:0 14px;border-radius:9999px;border:1px solid #FF7A59;background:rgba(20,17,14,0.9);color:#F1E9DF;font:13px 'Archivo',sans-serif;cursor:pointer;display:flex;align-items:center;gap:8px}
#sj-merke[hidden]{display:none}
#sj-merke span{font-size:16px;color:#FF7A59}
@media (max-width:560px){.sj-fam,.sj-und{grid-template-columns:18px minmax(0,1fr) 40px}.sj-stolpe,.sj-celle{display:none}}
.spiller.venstre{right:auto;left:max(16px,env(safe-area-inset-left,0px))}
.sj-andre{padding:14px 6px 4px !important}

<!-- ØNSKELISTA -->

<script>
// ---------- liten motor som tolker designets mal ({{hull}}, sc-for, sc-if, hendelser) ----------
(function () {
  const LAGRE = 'platesamlingen.side.v1';
  const NOKLER = ['moved', 'placed', 'gone', 'extra', 'wish', 'np', 'discogs'];
  const STD = { moved: {}, placed: {}, gone: {}, extra: [], np: -1 };
  // kanonisk JSON (sorterte nøkler), så lokale og lagrede utgaver kan sammenlignes
  const canon = (v) => JSON.stringify(v, (k, x) => (x && typeof x === 'object' && !Array.isArray(x) ? Object.keys(x).sort().reduce((o, key) => { o[key] = x[key]; return o; }, {}) : x));
  const utdrag = (st) => { const o = {}; NOKLER.forEach((k) => { if (st[k] !== undefined) o[k] = st[k]; }); return o; };
  window.lagret = function () { try { return Object.assign({}, STD, JSON.parse(localStorage.getItem(LAGRE) || '{}')); } catch (e) { return Object.assign({}, STD); } };
  // ---------- lagring i GitHub-prosjektet: data/tilstand.json (+ omslag/<nid>.jpg for nye plater) ----------
  // Alle kan se rommet. Bare den som har lagt inn en GitHub-nøkkel på enheten sin, kan lagre endringer.
  const GH = (() => {
    const h = location.hostname, deler = location.pathname.split('/').filter(Boolean);
    return {
      eier: h.endsWith('.github.io') ? h.split('.')[0] : 'NicolaiLangehaug',
      repo: h.endsWith('.github.io') && deler[0] && !/\.html?$/.test(deler[0]) ? deler[0] : 'Musikkhylla',
      fil: 'data/tilstand.json',
    };
  })();
  const NOKKEL = 'platesamlingen.nokkel', ULAGRET = 'platesamlingen.ulagret';
  // endringer som ennå ikke er bekreftet lagret i GitHub, tas vare på lokalt til de er det (også over omlasting)
  const settUlagret = (s) => { try { if (s) localStorage.setItem(ULAGRET, s); else localStorage.removeItem(ULAGRET); } catch (e) {} };
  const lesUlagret = () => { try { return localStorage.getItem(ULAGRET) || ''; } catch (e) { return ''; } };
  const lesNokkel = () => { try { return localStorage.getItem(NOKKEL) || ''; } catch (e) { return ''; } };
  let nokkel = lesNokkel(), sha = null, fjernKlar = false, sistLagret = '', tidtaker = null, skriver = false, status = 'laster';

<script>

  // «Snu hodet»: rullingen styrer hvor du ser. Først langs langveggen, så dreier rommet rundt hjørnet

  turnSetup(V, S2) {
    const L = 1340, E = 760;
    const p1 = Math.max(0, L - 0.8 * V), xc1 = L - p1, T = 0.75 * V;
    const x3 = E < 0.9 * V ? (V - E) / 2 : 0.05 * V, p3 = Math.max(0, E - 0.9 * V);
    this.turnGeo = { V, S2, p1, T, p3, xc1, x3 };
    requestAnimationFrame(() => this.syncTurn());
    return p1 + T + p3;
  }
  syncPanel(cont, S2) {
    const el = document.getElementById('romboks'), P = this.PL[cont];
    if (!el || !P || P.x === undefined || this._panelCont === cont) return;
    this._panelCont = cont;
    el.scrollTo({ left: Math.max(0, (P.x + 32 + P.w / 2) * S2 - el.clientWidth / 2), behavior: 'smooth' });
  }
  syncTurn() {
    const el = document.getElementById('romboks'), g = this.turnGeo, root = document.documentElement;
    if (!el || !g) return;
    if (!el._snu) { el._snu = true; el.addEventListener('scroll', () => this.syncTurn(), { passive: true }); }
    if (this.state && this.state.panel) return;
    const sc = el.scrollLeft / g.S2;
    let t = 0, xc;
