# Henter oppskrifter fra lenker. Startes når appen legger en bestilling i imports/.
name: Hent oppskrift fra lenke

on:
  push:
    branches: [main]
    paths: ['imports/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Pillow (for bilder)
        run: pip install --quiet pillow
      - name: Hent og lagre
        run: |
          git config user.name "Matboksen"
          git config user.email "matboksen@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            if [ -z "$(ls imports/*.json 2>/dev/null)" ]; then echo "Ingen bestillinger."; exit 0; fi
            python import_recipe.py
            git add -A
            git commit --quiet -m "Hentet oppskrift fra lenke" || exit 0
            if git push --quiet origin HEAD:main; then exit 0; fi
            echo "Noen lagret samtidig, prøver igjen ($attempt)"; sleep $((attempt * 5))
          done
          exit 1
